apiVersion: apps/v1
kind: Deployment
metadata:
  name: legalpulse
spec:
  replicas: 2
  selector: { matchLabels: { app: legalpulse } }
  template:
    metadata: { labels: { app: legalpulse } }
    spec:
      containers:
      - name: api
        image: your-dockerhub/legalpulse:latest
        ports: [{ containerPort: 8000 }]
